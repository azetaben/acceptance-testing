status=warn
name=SauceDemoTestLogging
appenders=console, rolling
appender.console.type=Console
appender.console.name=CONSOLE
appender.console.target=SYSTEM_OUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} %-5level %c{1}:%L - %msg%n
appender.rolling.type=RollingFile
appender.rolling.name=FILE
appender.rolling.fileName=logs/automation.out
appender.rolling.filePattern=logs/automation-%d{yyyy-MM-dd}-%i.out.gz
appender.rolling.layout.type=PatternLayout
appender.rolling.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} %-5level %c{1}:%L - %msg%n
appender.rolling.policies.type=Policies
appender.rolling.policies.size.type=SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=10MB
appender.rolling.strategy.type=DefaultRolloverStrategy
appender.rolling.strategy.max=5
rootLogger.level=info
rootLogger.appenderRefs=stdout, rolling
rootLogger.appenderRef.stdout.ref=CONSOLE
rootLogger.appenderRef.rolling.ref=FILE
# Optional: reduce Selenium noise
# logger.selenium.name = org.openqa.selenium
# logger.selenium.level = error

